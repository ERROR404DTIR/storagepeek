<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StoragePeek</title><style>body{margin:0;background:#0b1020;color:#e7edf8;font:15px/1.5 system-ui;padding:24px}main{max-width:1000px;margin:auto}h1{font-size:38px;margin:0}.muted{color:#91a0b9}.panel{background:#121a2d;border:1px solid #26334d;border-radius:14px;padding:16px;margin:14px 0}label{display:block;color:#91a0b9;margin:10px 0 4px}input,textarea,select{width:100%;box-sizing:border-box;background:#080e1a;color:#e7edf8;border:1px solid #33415d;border-radius:8px;padding:10px}button{background:linear-gradient(110deg,#7c3aed,#0891b2);border:0;border-radius:8px;padding:10px 14px;color:white;cursor:pointer;margin:6px 4px 6px 0}pre{white-space:pre-wrap;background:#080e1a;padding:12px;border-radius:8px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.status{color:#67e8a5}</style><main><h1>StoragePeek</h1><p class="muted">Inspect browser storage belonging to the current origin. No remote access.</p><section class="panel"><div><select id="type"><option value="localStorage">localStorage</option><option value="sessionStorage">sessionStorage</option></select><button id="refresh">Refresh</button><button id="export">Export JSON</button></div><label>Filter</label><input id="filter" placeholder="Filter keys and values"><div id="items"></div></section><section class="panel"><h2>Entry editor</h2><label>Key</label><input id="key"><label>Value</label><textarea id="value"></textarea><button id="save">Save</button><button id="delete">Delete selected</button><span id="msg" class="status"></span><p class="muted">Only this page's origin is accessible. Do not store passwords or secrets in browser storage.</p></section></main><script>const $=id=>document.getElementById(id);let selected=null;const store=()=>window[$('type').value];function refresh(){const q=$('filter').value.toLowerCase();$('items').innerHTML='';for(let i=0;i<store().length;i++){const k=store().key(i),v=store().getItem(k);if(!(k+' '+v).toLowerCase().includes(q))continue;const b=document.createElement('button');b.style.display='block';b.style.width='100%';b.textContent=k+' · '+v.slice(0,90);b.onclick=()=>{selected=k;$('key').value=k;$('value').value=v};$('items').append(b)}}$('refresh').onclick=refresh;$('type').onchange=refresh;$('filter').oninput=refresh;$('save').onclick=()=>{try{store().setItem($('key').value,$('value').value);selected=$('key').value;$('msg').textContent='Saved';refresh()}catch(e){$('msg').textContent=e.message}};$('delete').onclick=()=>{if(selected!==null){store().removeItem(selected);selected=null;$('key').value='';$('value').value='';$('msg').textContent='Deleted';refresh()}};$('export').onclick=()=>{const data={};for(let i=0;i<store().length;i++){const k=store().key(i);data[k]=store().getItem(k)}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='browser-storage.json';a.click()};refresh();</script></html>
